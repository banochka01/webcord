name: Check

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Run project checks
        run: npm run check
        env:
          DATABASE_URL: postgresql://webcord:webcord@localhost:5432/webcord

  unsigned-ios-ipa:
    name: Unsigned iOS IPA
    if: github.ref == 'refs/heads/codex/webcord-4.3-pulse-ios' && !contains(github.event.head_commit.message, '[cleanup-deploy]')
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter 3.44.4
        shell: bash
        run: |
          git clone --depth 1 --branch 3.44.4 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Resolve native dependencies
        working-directory: clients/webcord_native
        run: flutter pub get

      - name: Analyze and test native client
        working-directory: clients/webcord_native
        run: |
          flutter analyze
          flutter test test/widget_test.dart

      - name: Build unsigned iOS application
        working-directory: clients/webcord_native
        run: flutter build ios --release --no-codesign --dart-define=WEBCORD_API_URL=https://webcordes.ru/api

      - name: Package IPA
        shell: bash
        working-directory: clients/webcord_native
        run: |
          version="$(sed -n 's/^version: *//p' pubspec.yaml | head -1 | tr '+' '-')"
          mkdir -p build/ios/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          /usr/bin/zip -qry "WebCord-${version}-ios-unsigned.ipa" Payload
          shasum -a 256 "WebCord-${version}-ios-unsigned.ipa" > SHA256SUMS.txt

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: WebCord-iOS-unsigned
          path: |
            clients/webcord_native/build/ios/ipa/*.ipa
            clients/webcord_native/build/ios/ipa/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
